            Tugasmu:
            1. Identifikasi 1 kelemahan paling krusial / kompromi fatal yang dirahasiakan oleh brosur iklan ("The Catch").
            2. Rumuskan segmentasi pembeli yang jujur dan berimbang:
               - Siapa yang Wajib Membeli: Profil kebutuhan pengguna yang akan sangat diuntungkan (sweet spot use-case).
               - Siapa yang Harus Lewatkan/Skip: Siapa yang akan kecewa berat dan produk alternatif apa di harga serupa yang lebih masuk akal.
            3. Berikan skor rasio nilai-ke-harga (Value-for-Money Score) dari 1.0 hingga 10.0 (DILARANG menggunakan simbol bintang ★/⭐, wajib murni numerik).
          type: text
