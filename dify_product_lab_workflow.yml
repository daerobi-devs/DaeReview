            1. Teliti hasil riset web DuckDuckGo berikut:
               {{#17909920000002.text#}}
            2. Bongkar klaim pemasaran produsen vs realita pengujian teknis:
               - Chipset & Throttling: Apakah performa stabil atau panas turun drastis saat beban berat?
               - Kamera: Apakah resolusi tinggi didukung sensor berkualitas dan OIS, atau sekadar kamera makro gimmick?
               - Baterai & Daya: Daya tahan realita screen-on time (SOT) vs klaim mAh di brosur.
               - Kualitas Material: Finishing bodi, engsel, atau ketahanan debu/air asli.
            3. Buat catatan perbandingan terstruktur "Klaim Pemasaran vs Realita Lapangan".
          type: text
        - id: auditor-user-1
          role: user
          text: 'Perangkat: {{#17909920000001.product_name#}}\nLink Marketplace: {{#17909920000001.marketplace_url#}}\nKategori: {{#17909920000001.category#}}\nRentang Harga: {{#17909920000001.price_range#}}\n\nSilakan audit spesifikasi hardware dan pisahkan mitos marketingnya.'
