          role: user
          text: 'Hasil Audit Auditor Hardware:\n{{#17909920000003.text#}}\n\nPerangkat: {{#17909920000001.product_name#}}\n\nRumuskan The Catch, segmentasi Beli vs Skip, dan skor rasio harga.'
