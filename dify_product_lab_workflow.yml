    - data:
        code: |
          import json
          import re

          def main(llm_text: str, marketplace_url: str = "") -> dict:
              cleaned = llm_text.strip() if llm_text else ""
              match = re.search(r'```(?:json)?\s*([\s\S]*?)\s*```', cleaned)
              if match:
                  cleaned = match.group(1).strip()
              
              data = {}
              try:
                  data = json.loads(cleaned)
              except Exception:
                  title_match = re.search(r'"title"\s*:\s*"([^"]+)"', cleaned)
                  data["title"] = title_match.group(1) if title_match else "Ulasan Hardware DaeReview Lab"
                  data["summary"] = "Audit perangkat independen oleh Tim 2 Product Lab DaeReview."
                  data["category"] = "Gadget"
                  data["content"] = cleaned

              title = data.get("title", "Review Gadget DaeReview Lab").strip()
              raw_slug = data.get("slug") or ""
              slug = re.sub(r'[^a-zA-Z0-9-]', '', raw_slug.lower().replace(' ', '-'))
              if not slug:
                  slug = "review-lab-" + str(abs(hash(title)) % 100000)

              summary_text = data.get("summary") or "Audit teknis dan komparasi oleh DaeReview Product Lab."
              the_catch = data.get("the_catch") or "Perhatikan kecocokan kompromi perangkat terhadap kebutuhan Anda."
              eff_link = data.get("product_link") or marketplace_url or ""

              rating_val = 8.0
              try:
                  rating_val = float(data.get("rating", 8.0))
              except Exception:
                  rating_val = 8.0

              payload = {
                  "title": title,
                  "slug": slug,
                  "summary": summary_text,
                  "category": data.get("category", "Gadget"),
                  "author": data.get("author", "Tim Riset Hardware DaeReview"),
                  "division": "Tim 2: DaeReview Product Lab",
                  "readTime": data.get("readTime", "6 menit"),
                  "content": data.get("content", cleaned),
                  "the_catch": the_catch,
                  "rating": rating_val,
                  "product_link": eff_link,
                  "type": "product_review",
                  "status": "draft"
              }

              return {
                  "title": payload["title"],
                  "slug": payload["slug"],
                  "the_catch": payload["the_catch"],
                  "rating": payload["rating"],
                  "json_payload": json.dumps(payload, ensure_ascii=False)
              }
        code_language: python3
        outputs:
          json_payload:
            type: string
          rating:
            type: number
          slug:
            type: string
          the_catch:
            type: string
          title:
            type: string
        selected: false
        title: Code Sanitizer & Lab Validator
        type: code
        variables:
        - value_selector:
          - '17909920000005'
          - text
          variable: llm_text
        - value_selector:
