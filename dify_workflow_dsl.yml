    - data:
        code: "import json\nimport re\n\ndef main(llm_text: str) -> dict:\n    cleaned\
          \ = llm_text.strip()\n    if \"```json\" in cleaned:\n        cleaned =\
          \ cleaned.split(\"```json\")[1].split(\"```\")[0].strip()\n    elif \"```\"\
          \ in cleaned:\n        cleaned = cleaned.split(\"```\")[1].split(\"```\"\
          )[0].strip()\n    \n    try:\n        data = json.loads(cleaned)\n    except\
          \ Exception:\n        title_match = re.search(r'\"title\"\\s*:\\s*\"([^\"\
          ]+)\"', cleaned)\n        title = title_match.group(1) if title_match else\
          \ \"Ulasan Produk DaeReview\"\n        data = {\n            \"title\":\
          \ title,\n            \"slug\": \"ulasan-produk-\" + str(abs(hash(title))\
          \ % 100000),\n            \"excerpt\": \"Ulasan komprehensif gadget berstandar\
          \ editorial Swiss oleh DaeReview.\",\n            \"category\": \"gadget\"\
          ,\n            \"author\": \"DaeReview AI Editorial\",\n            \"rating\"\
          : 8.0,\n            \"pros\": [\"Performa teruji\", \"Desain fungsional\"\
          ],\n            \"cons\": [\"Harga fluktuatif\"],\n            \"the_catch\"\
          : \"Perlu diperhatikan kecocokan dengan ekosistem perangkat Anda saat ini.\"\
          ,\n            \"verdict\": \"Pilihan solid di kelas harganya jika Anda\
          \ membutuhkan keandalan fungsional.\",\n            \"content\": cleaned\n\
          \        }\n    \n    raw_slug = data.get('slug', '')\n    slug = re.sub(r'[^a-zA-Z0-9\\\
          -]', '', raw_slug.lower().replace(' ', '-'))\n    if not slug:\n       \
          \ slug = \"ulasan-gadget-\" + str(abs(hash(data.get('title', ''))) % 100000)\n\
          \    data['slug'] = slug\n    \n    rating_val = 8.0\n    try:\n       \
          \ rating_val = float(data.get('rating', 8.0))\n    except Exception:\n \
          \       rating_val = 8.0\n        \n    payload = {\n        \"title\":\
          \ data.get(\"title\", \"Ulasan Gadget DaeReview\"),\n        \"slug\": slug,\n\
          \        \"excerpt\": data.get(\"excerpt\", \"\"),\n        \"category\"\
          : data.get(\"category\", \"gadget\"),\n        \"author\": data.get(\"author\"\
          , \"DaeReview AI Editorial\"),\n        \"readTime\": \"6 min\",\n     \
          \   \"content\": data.get(\"content\", \"\"),\n        \"rating\": rating_val,\n\
          \        \"pros\": data.get(\"pros\", []),\n        \"cons\": data.get(\"\
          cons\", []),\n        \"the_catch\": data.get(\"the_catch\", \"\"),\n  \
          \      \"verdict\": data.get(\"verdict\", \"\")\n    }\n    \n    return\
          \ {\n        \"title\": payload[\"title\"],\n        \"slug\": payload[\"\
          slug\"],\n        \"excerpt\": payload[\"excerpt\"],\n        \"the_catch\"\
          : payload[\"the_catch\"],\n        \"verdict\": payload[\"verdict\"],\n\
          \        \"rating\": payload[\"rating\"],\n        \"json_payload\": json.dumps(payload,\
          \ ensure_ascii=False)\n    }\n"
        code_language: python3
        outputs:
          excerpt:
            type: string
          json_payload:
            type: string
          rating:
            type: number
          slug:
            type: string
          the_catch:
            type: string
          title:
            type: string
          verdict:
            type: string
        selected: false
        title: JSON Parser & Formatter
        type: code
