    - data:
        code: |
          import json
          import re

          def main(llm_text: str, source_url: str = "") -> dict:
              cleaned = llm_text.strip() if llm_text else ""
              match = re.search(r'```(?:json)?\s*([\s\S]*?)\s*```', cleaned)
              if match:
                  cleaned = match.group(1).strip()
              
              data = {}
              try:
                  data = json.loads(cleaned)
              except Exception:
                  title_match = re.search(r'"title"\s*:\s*"([^"]+)"', cleaned)
                  data["title"] = title_match.group(1) if title_match else "Laporan Khusus Redaksi DaeReview"
                  data["summary"] = "Liputan investigasi terkini oleh Tim 1 Newsroom DaeReview."
                  data["category"] = "Teknologi & AI"
                  data["content"] = cleaned

              title = data.get("title", "Kabar Terkini Teknologi DaeReview").strip()
              raw_slug = data.get("slug") or ""
              slug = re.sub(r'[^a-zA-Z0-9-]', '', raw_slug.lower().replace(' ', '-'))
              if not slug:
                  slug = "berita-" + str(abs(hash(title)) % 100000)

              summary_text = data.get("summary") or "Liputan teknologi terkini oleh DaeReview Newsroom."
              eff_source = data.get("source_url") or source_url or ""

              payload = {
                  "title": title,
                  "slug": slug,
                  "summary": summary_text,
                  "category": data.get("category", "Teknologi & AI"),
                  "author": data.get("author", "Tim Redaksi DaeReview"),
                  "division": "Tim 1: DaeReview Newsroom",
                  "readTime": data.get("readTime", "4 menit"),
                  "content": data.get("content", cleaned),
                  "source_url": eff_source,
                  "status": "draft"
              }

              return {
                  "title": payload["title"],
                  "slug": payload["slug"],
                  "summary": payload["summary"],
                  "category": payload["category"],
                  "json_payload": json.dumps(payload, ensure_ascii=False)
              }
        code_language: python3
        outputs:
          category:
            type: string
          json_payload:
            type: string
          slug:
            type: string
          summary:
            type: string
          title:
            type: string
        selected: false
        title: Code Sanitizer & JSON Validator
        type: code
        variables:
        - value_selector:
          - '17909910000005'
          - text
          variable: llm_text
        - value_selector:
          - '17909910000001'
          - source_url
          variable: source_url
      height: 120
