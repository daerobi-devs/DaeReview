    - data:
        code: |
          import json
          import re

          def main(llm_text: str, input_text: str = "") -> dict:
              cleaned = llm_text.strip() if llm_text else ""
              match = re.search(r'```(?:json)?\s*([\s\S]*?)\s*```', cleaned)
              if match:
                  cleaned = match.group(1).strip()
              
              data = {}
              try:
                  data = json.loads(cleaned)
              except Exception:
                  data["decision"] = "DISPATCH_TIM_1" if "shopee" not in input_text.lower() and "tokopedia" not in input_text.lower() else "DISPATCH_TIM_2"
                  data["target_division"] = "Tim 1: DaeReview Newsroom" if data["decision"] == "DISPATCH_TIM_1" else "Tim 2: DaeReview Product Lab"
                  data["topic_title"] = input_text
                  data["recommended_angle"] = "Liputan objektif berstandar Swiss Editorial."
                  data["telegram_message"] = f"Topik: {input_text} disarankan untuk diproses oleh {data['target_division']}."

              decision = data.get("decision", "DISPATCH_TIM_1")
              target_div = data.get("target_division", "Tim 1: DaeReview Newsroom")
              topic_title = data.get("topic_title") or input_text or "Topik Pilihan Redaksi"
              angle = data.get("recommended_angle") or "Sudut pandang independen"
              telegram_msg = data.get("telegram_message") or cleaned

              return {
                  "decision": decision,
                  "target_division": target_div,
                  "topic_title": topic_title,
                  "recommended_angle": angle,
                  "telegram_message": telegram_msg,
                  "json_dispatch": json.dumps(data, ensure_ascii=False)
              }
        code_language: python3
        outputs:
          decision:
            type: string
          json_dispatch:
            type: string
          recommended_angle:
            type: string
          telegram_message:
            type: string
          target_division:
            type: string
          topic_title:
            type: string
        selected: false
        title: Code Sanitizer & Decision Parser
        type: code
        variables:
        - value_selector:
          - '17909930000004'
          - text
          variable: llm_text
        - value_selector:
          - '17909930000001'
          - input_text
          variable: input_text
      height: 120
      id: '17909930000005'
      position:
        x: 1280
