            \ {{#17909800000001.product_or_news_link#}}\n- Catatan: {{#17909800000001.custom_notes#}}\n\
            \nBerikut DATA HASIL PENCARIAN REAL DARI INTERNET (DuckDuckGo):\n{{#17909800000002.text#}}\n\
            \nSilakan rumuskan dossier riset tren, golden angle, data harga riil, dan\
