    - data:
        code: |
          import json
          import re

          def main(llm_text: str, product_link_input: str) -> dict:
              cleaned = llm_text.strip()
              if "```json" in cleaned:
                  cleaned = cleaned.split("```json")[1].split("```")[0].strip()
              elif "```" in cleaned:
                  cleaned = cleaned.split("```")[1].split("```")[0].strip()
              
              try:
                  data = json.loads(cleaned)
              except Exception:
                  data = {}

              if not isinstance(data, dict):
                  data = {}

              title = data.get("title") or "Ulasan Editorial DaeReview"
              raw_slug = data.get("slug") or ""
              slug = re.sub(r'[^a-zA-Z0-9-]', '', raw_slug.lower().replace(' ', '-'))
              if not slug:
                  slug = "artikel-redaksi-" + str(abs(hash(title)) % 100000)

              rating_val = 8.0
              try:
                  rating_val = float(data.get("rating", 8.0))
              except Exception:
                  rating_val = 8.0

              eff_link = data.get("product_link") or product_link_input or ""
              summary_text = data.get("summary") or data.get("excerpt") or "Ulasan independen berstandar Swiss Editorial oleh DaeReview Squad."
              the_catch = data.get("the_catch") or "Kompromi teknis pada efisiensi perangkat."
              verdict = data.get("verdict") or "Rekomendasi layak uji untuk segmen pengguna yang tepat."

              payload = {
                  "title": title,
                  "slug": slug,
                  "summary": summary_text,
                  "excerpt": summary_text,
                  "category": data.get("category", "gadget"),
                  "author": data.get("author", "DaeReview Editorial Squad"),
                  "readTime": data.get("readTime", "6 min"),
                  "content": data.get("content", cleaned),
                  "rating": rating_val,
                  "product_link": eff_link,
                  "image": data.get("image", ""),
                  "pros": data.get("pros", ["Performa pengujian solid", "Rasio nilai kompetitif"]),
                  "cons": data.get("cons", ["Perhatikan kecocokan kebutuhan harian"]),
                  "the_catch": the_catch,
                  "verdict": verdict
              }

              return {
                  "title": payload["title"],
                  "slug": payload["slug"],
                  "excerpt": payload["excerpt"],
                  "the_catch": payload["the_catch"],
                  "verdict": payload["verdict"],
                  "rating": payload["rating"],
                  "product_link": eff_link,
                  "json_payload": json.dumps(payload, ensure_ascii=False)
              }
        code_language: python3
        outputs:
          excerpt:
            type: string
          json_payload:
            type: string
          product_link:
            type: string
          rating:
            type: number
          slug:
            type: string
          the_catch:
            type: string
          title:
            type: string
          verdict:
            type: string
        selected: false
